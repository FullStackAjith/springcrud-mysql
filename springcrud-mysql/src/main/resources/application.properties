spring.application.name=springcrud
server.port=8081

# ---------- MySQL connection ----------
# Database "cruddb" is created automatically if it does not exist.
# CHANGE username/password to match your MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/cruddb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" creates/updates tables automatically and keeps existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
